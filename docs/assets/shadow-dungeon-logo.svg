<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title description">
  <title id="title">Shadow Dungeon</title>
  <desc id="description">A moonlit dungeon gate and sword beside the Shadow Dungeon wordmark.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a31"/>
      <stop offset="1" stop-color="#090b14"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f0d4"/>
      <stop offset="1" stop-color="#b9c7e8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3a6ff"/>
      <stop offset="1" stop-color="#7051cb"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="10" y="10" width="700" height="220" rx="28" fill="url(#panel)" stroke="#7561ae" stroke-opacity=".7" stroke-width="2"/>
  <path d="M30 190H690" stroke="#8c78bd" stroke-opacity=".35"/>
  <g transform="translate(38 18)">
    <circle cx="94" cy="91" r="58" fill="#b7c7ed" opacity=".09" filter="url(#glow)"/>
    <path d="M112 28a53 53 0 1 0 42 86 47 47 0 0 1-42-86Z" fill="url(#moon)"/>
    <path d="M42 176V108a54 54 0 0 1 108 0v68Z" fill="#171a31" stroke="url(#violet)" stroke-width="5"/>
    <path d="M59 176v-67a37 37 0 0 1 74 0v67Z" fill="#080a13"/>
    <path d="M77 176v-54a19 19 0 0 1 38 0v54Z" fill="#24233b"/>
    <path d="M42 176h108M52 160h88M62 145h68" stroke="#8c78bd" stroke-width="3" opacity=".8"/>
    <path d="m172 60 34 34-6 6-34-34 3-12 3 6Zm-5 11 28 28-17 70-14-14 3-84Z" fill="url(#moon)" stroke="#e8defe" stroke-width="2"/>
    <path d="m174 149 13 13-8 8-13-13Z" fill="url(#violet)"/>
    <circle cx="73" cy="78" r="3" fill="#f5e8b8"/>
    <circle cx="151" cy="42" r="2.5" fill="#c7b5f0"/>
    <circle cx="158" cy="128" r="2" fill="#f5e8b8"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="start">
    <text x="270" y="111" fill="#f4f0ff" font-size="45" font-weight="700" letter-spacing="5">SHADOW</text>
    <text x="270" y="164" fill="url(#violet)" font-size="43" font-weight="700" letter-spacing="8">DUNGEON</text>
    <text x="273" y="193" fill="#b9bdd0" font-family="Arial, sans-serif" font-size="12" letter-spacing="4">CO-OP DUNGEON CRAWLER</text>
  </g>
</svg>
